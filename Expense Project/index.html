<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-wallet"></i> Kushala's Expense Tracker</h1>
            <p>Track your expenses and manage your budget effectively</p>
        </header>

        <!-- Summary Dashboard -->
        <section class="summary">
            <div class="summary-card">
                <div class="card balance">
                    <h3><i class="fas fa-rupee-sign"></i> Total Balance</h3>
                    <p id="total-balance">₹0.00</p>
                </div>
                <div class="card income">
                    <h3><i class="fas fa-arrow-up"></i> Total Income</h3>
                    <p id="total-income">₹0.00</p>
                </div>
                <div class="card expense">
                    <h3><i class="fas fa-arrow-down"></i> Total Expenses</h3>
                    <p id="total-expenses">₹0.00</p>
                </div>
            </div>
        </section>

        <!-- Add Transaction Form -->
        <section class="transaction-form">
            <h2><i class="fas fa-plus-circle"></i> Add New Transaction</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="description">Description:</label>
                    <input type="text" id="description" name="description" required placeholder="Enter transaction description">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount:</label>
                        <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00">
                    </div>
                    
                    <div class="form-group">
                        <label for="type">Type:</label>
                        <select id="type" name="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="food">🍔 Food & Dining</option>
                            <option value="transportation">🚗 Transportation</option>
                            <option value="entertainment">🎬 Entertainment</option>
                            <option value="utilities">💡 Utilities</option>
                            <option value="healthcare">🏥 Healthcare</option>
                            <option value="shopping">🛍️ Shopping</option>
                            <option value="education">📚 Education</option>
                            <option value="travel">✈️ Travel</option>
                            <option value="salary">💼 Salary</option>
                            <option value="freelance">💻 Freelance</option>
                            <option value="investment">📈 Investment</option>
                            <option value="other">📋 Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Transaction
                    </button>
                    <button type="button" id="cancel-edit" class="btn btn-secondary" style="display: none;">
                        <i class="fas fa-times"></i> Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <!-- Filter and Search -->
        <section class="filters">
            <div class="filter-group">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Search transactions...">
                    <i class="fas fa-search"></i>
                </div>
                
                <select id="filter-category">
                    <option value="">All Categories</option>
                    <option value="food">🍔 Food & Dining</option>
                    <option value="transportation">🚗 Transportation</option>
                    <option value="entertainment">🎬 Entertainment</option>
                    <option value="utilities">💡 Utilities</option>
                    <option value="healthcare">🏥 Healthcare</option>
                    <option value="shopping">🛍️ Shopping</option>
                    <option value="education">📚 Education</option>
                    <option value="travel">✈️ Travel</option>
                    <option value="salary">💼 Salary</option>
                    <option value="freelance">💻 Freelance</option>
                    <option value="investment">📈 Investment</option>
                    <option value="other">📋 Other</option>
                </select>
                
                <select id="filter-type">
                    <option value="">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <input type="month" id="filter-month" title="Filter by month">
                
                <button class="btn btn-secondary" id="clear-filters">
                    <i class="fas fa-filter"></i> Clear Filters
                </button>
            </div>
        </section>

        <!-- Transaction History -->
        <section class="transaction-history">
            <div class="history-header">
                <h2><i class="fas fa-history"></i> Transaction History</h2>
                <div class="history-actions">
                    <button class="btn btn-outline" id="export-data">
                        <i class="fas fa-download"></i> Export CSV
                    </button>
                    <button class="btn btn-outline" id="clear-all">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                </div>
            </div>
            
            <div class="transaction-list" id="transaction-list">
                <div class="no-transactions">
                    <i class="fas fa-receipt"></i>
                    <p>No transactions yet. Add your first transaction above!</p>
                </div>
            </div>
        </section>

        <!-- Category Analytics -->
        <section class="analytics">
            <h2><i class="fas fa-chart-pie"></i> Expense Breakdown</h2>
            <div class="category-breakdown" id="category-breakdown">
                <!-- Category breakdown will be populated by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" id="close-modal">&times;</span>
            <h3>Edit Transaction</h3>
            <form id="edit-form">
                <!-- Form content will be populated by JavaScript -->
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
